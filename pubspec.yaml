name: milk_parlour
description: Milk Collection & Invoice Management App for Hemant Kumawat Milk Center
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # File System
  path_provider: ^2.1.3

  # Sharing (WhatsApp etc.)
  share_plus: ^11.0.0

  # Open files natively on device
  open_file: ^3.3.2

  # Charts
  fl_chart: ^0.70.2

  # Persistent settings
  shared_preferences: ^2.3.4
  # File Picker (backup/restore)
  file_picker: ^10.3.2

  # Date formatting
  intl: ^0.20.2

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
